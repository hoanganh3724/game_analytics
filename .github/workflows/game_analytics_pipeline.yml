name: Game Analytics E2E Pipeline

on:
  schedule:
    # Chạy tự động lúc 02:00 AM UTC mỗi ngày
    - cron: '0 2 * * *'
  workflow_dispatch: # Cho phép nhấn nút chạy thủ công trên GitHub UI

jobs:
  run_pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-duckdb dbt-utils dbt-expectations

      - name: Install dbt Packages
        run: dbt deps

      - name: Run dbt Data Transformations
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: dbt run --target prod

      - name: Run Data Quality Tests
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: dbt test --target prod

      - name: Generate & Upload Lineage Documentation
        if: always()
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          dbt docs generate